name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run test:smoke
      - run: npm run package:vsix
      - name: Upload VSIX packages and generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: unify-notifier-build
          path: |
            artifacts/*.vsix
            package-lock.json
          if-no-files-found: error
