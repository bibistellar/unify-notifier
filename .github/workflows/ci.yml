name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:smoke
      - run: npm run package:vsix
      - name: Validate VSIX payloads
        shell: bash
        run: |
          set -euo pipefail
          UI=$(ls artifacts/unify-notifier-ui-*.vsix)
          ROUTER=$(ls artifacts/unify-notifier-router-*.vsix)
          PACK=$(ls artifacts/unify-notifier-[0-9]*.vsix)
          unzip -l "$UI" | grep -q 'extension/dist/extension.js'
          unzip -l "$UI" | grep -q 'extension/node_modules/node-notifier/index.js'
          unzip -l "$ROUTER" | grep -q 'extension/dist/extension.js'
          unzip -l "$ROUTER" | grep -q 'extension/dist/agent-config.js'
          unzip -l "$ROUTER" | grep -q 'extension/assets/unify-notifier-cli.js'
          unzip -l "$ROUTER" | grep -q 'extension/node_modules/jsonc-parser/package.json'
          unzip -l "$PACK" | grep -q 'extension/package.json'
      - name: Upload VSIX packages
        uses: actions/upload-artifact@v4
        with:
          name: unify-notifier-build
          path: artifacts/*.vsix
          if-no-files-found: error
